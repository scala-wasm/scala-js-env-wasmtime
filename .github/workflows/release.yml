name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime,wac-cli,wasm-tools

      - name: Install wit-bindgen
        run: cargo install --git https://github.com/scala-wasm/wit-bindgen --branch scala

      - name: Check tool versions
        run: |
          wasmtime --version
          wac --version
          wasm-tools --version
          wit-bindgen --version

      - name: Test
        run: sbt scalajs-env-wasmtime/test test-project/run

      - name: Publish
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
